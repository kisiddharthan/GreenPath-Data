name: Validate GreenPath Feed

on:
  pull_request:
    paths:
      - "feeds/**"
      - "parser/**"
      - "validation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate-feed.yaml"

  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "feeds/**"
      - "parser/**"
      - "validation/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/validate-feed.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Data Format v1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Validate published feed
        run: |
          python validation/validate_feed.py \
            feeds/latest.json
